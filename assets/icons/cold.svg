<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><defs>
<radialGradient id="cobg" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#5590BB" stop-opacity=".35"/><stop offset="100%" stop-color="#000D1A" stop-opacity="0"/></radialGradient>
<filter id="coglow"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="cosm"><feGaussianBlur stdDeviation=".7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="48" height="48" fill="url(#cobg)"/>
<!-- snowflake main axes — 6-fold -->
<g stroke="#A8D8F0" stroke-linecap="round" filter="url(#coglow)">
  <line x1="24" y1="6" x2="24" y2="42" stroke-width="1.8" opacity=".8"><animate attributeName="opacity" values=".6;1;.6" dur="3s" repeatCount="indefinite"/></line>
  <line x1="24" y1="6" x2="24" y2="42" stroke-width="1.8" opacity=".8" transform="rotate(60 24 24)"><animate attributeName="opacity" values=".6;1;.6" dur="3s" begin=".5s" repeatCount="indefinite"/></line>
  <line x1="24" y1="6" x2="24" y2="42" stroke-width="1.8" opacity=".8" transform="rotate(120 24 24)"><animate attributeName="opacity" values=".6;1;.6" dur="3s" begin="1s" repeatCount="indefinite"/></line>
</g>
<!-- branch tines -->
<g stroke="#C8EEFF" stroke-linecap="round" stroke-width="1.2" filter="url(#cosm)">
  <!-- vertical axis tines -->
  <line x1="20" y1="14" x2="24" y2="18"/><line x1="28" y1="14" x2="24" y2="18"/>
  <line x1="20" y1="30" x2="24" y2="34"/><line x1="28" y1="30" x2="24" y2="34"/>
  <!-- 60deg tines -->
  <line x1="20" y1="14" x2="24" y2="18" transform="rotate(60 24 24)"/><line x1="28" y1="14" x2="24" y2="18" transform="rotate(60 24 24)"/>
  <line x1="20" y1="30" x2="24" y2="34" transform="rotate(60 24 24)"/><line x1="28" y1="30" x2="24" y2="34" transform="rotate(60 24 24)"/>
  <!-- 120deg tines -->
  <line x1="20" y1="14" x2="24" y2="18" transform="rotate(120 24 24)"/><line x1="28" y1="14" x2="24" y2="18" transform="rotate(120 24 24)"/>
  <line x1="20" y1="30" x2="24" y2="34" transform="rotate(120 24 24)"/><line x1="28" y1="30" x2="24" y2="34" transform="rotate(120 24 24)"/>
</g>
<!-- rotating outer hex ring -->
<g opacity=".45">
  <polygon points="24,8 30,12 30,20 24,24 18,20 18,12" fill="none" stroke="#88CCEE" stroke-width=".8">
    <animateTransform attributeName="transform" type="rotate" from="0 24 24" to="60 24 24" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".35;.6;.35" dur="4s" repeatCount="indefinite"/>
  </polygon>
</g>
<!-- center crystal -->
<circle cx="24" cy="24" r="4" fill="none" stroke="#E0F6FF" stroke-width="1.5" filter="url(#coglow)"/>
<circle cx="24" cy="24" r="2" fill="#D0F0FF" opacity=".9"/>
<!-- falling snowflakes -->
<circle cx="10" cy="10" r="1.2" fill="#88CCEE" opacity=".6"><animate attributeName="cy" values="10;42" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="38" cy="5" r="1" fill="#AADDFF" opacity=".5"><animate attributeName="cy" values="5;40" dur="3.5s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="3.5s" begin="1.2s" repeatCount="indefinite"/></circle>
<circle cx="6" cy="22" r="1.3" fill="#88BBDD" opacity=".5"><animate attributeName="cy" values="22;48" dur="3s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
</svg>