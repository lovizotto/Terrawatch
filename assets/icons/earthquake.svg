<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><defs>
<radialGradient id="ebg" cx="50%" cy="60%" r="60%"><stop offset="0%" stop-color="#FF9000" stop-opacity=".3"/><stop offset="100%" stop-color="#1A0800" stop-opacity="0"/></radialGradient>
<filter id="eglow"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="48" height="48" fill="url(#ebg)"/>
<!-- ground layers -->
<rect x="2" y="32" width="44" height="14" rx="2" fill="#1A1000"/>
<rect x="2" y="32" width="44" height="5" rx="1" fill="#2A1800" opacity=".8"/>
<!-- seismic wave lines -->
<polyline points="4,26 8,26 10,20 13,32 16,18 19,30 21,23 23,29 25,24 27,28 30,22 33,30 35,26 38,26 44,26" stroke="#FFA032" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <animateTransform attributeName="transform" type="translate" values="-1,0;1,0;0,-.5;0,.5;-1,0" dur=".25s" repeatCount="indefinite"/>
</polyline>
<!-- shockwave rings from epicenter -->
<circle cx="24" cy="28" r="3" fill="#FF8800" filter="url(#eglow)" opacity=".9"/>
<circle cx="24" cy="28" r="3" stroke="#FFA032" stroke-width="1.5" fill="none">
  <animate attributeName="r" values="3;20" dur="1.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".8;0" dur="1.8s" repeatCount="indefinite"/>
</circle>
<circle cx="24" cy="28" r="3" stroke="#FF6600" stroke-width="1" fill="none">
  <animate attributeName="r" values="3;20" dur="1.8s" begin=".6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".6;0" dur="1.8s" begin=".6s" repeatCount="indefinite"/>
</circle>
<circle cx="24" cy="28" r="3" stroke="#FFD060" stroke-width=".8" fill="none">
  <animate attributeName="r" values="3;20" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".4;0" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
</circle>
<!-- ground crack -->
<path d="M18 32 L21 29 L24 31 L27 27 L30 32" stroke="#FF5500" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".7">
  <animate attributeName="opacity" values=".4;.9;.4" dur="1.8s" repeatCount="indefinite"/>
</path>
</svg>