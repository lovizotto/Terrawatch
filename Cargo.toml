[package]
name        = "tw-wasm"
version     = "0.1.0"
edition     = "2021"
description = "TerraWatch — natural disaster monitor, Rust/WASM core"

[lib]
crate-type = ["cdylib"]

# ─── Dependencies ────────────────────────────────────────────
[dependencies]
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
serde                = { version = "1", features = ["derive"] }
serde-wasm-bindgen   = "0.6"
serde_json           = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version  = "0.3"
features = [
  # Core DOM
  "console", "Window", "Document", "Element",
  "HtmlElement", "HtmlAnchorElement", "HtmlButtonElement",
  "Node", "NodeList", "Text",
  # Events
  "EventTarget", "Event", "MouseEvent", "MessageEvent",
  # Worker
  "Worker", "WorkerOptions", "WorkerType",
  # Geolocation
  "Geolocation", "Position", "PositionOptions",
  "PositionError", "Coordinates",
  # CSS / Layout
  "DomTokenList", "CssStyleDeclaration",
  # Misc
  "Location", "Navigator", "Performance",
  "ScrollToOptions", "ScrollBehavior",
]

# ─── Build profile ───────────────────────────────────────────
[profile.release]
opt-level = "z"    # minimise binary size
lto       = true
